<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Hunter · Demo</title>
<meta name="description" content="Demonstração interativa do Job Hunter: plataforma que usa IA para encontrar, classificar e acompanhar vagas de tecnologia.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A66C2'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M18.5 18.5 24 24' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet">
<style>
:root {
  --primary: #0A66C2; --primary-dark: #004182; --primary-a08: rgba(10,102,194,.08); --primary-a12: rgba(10,102,194,.12);
  --secondary: #5E6C84; --success: #057642; --success-dark: #03522E; --warning: #B26A00; --error: #C9372C; --purple: #7A3EB1;
  --bg: #F4F6F9; --paper: #FFFFFF; --col: #EEF1F5; --text: #1D2226; --text2: #5E6C84; --disabled: #9AA3B2;
  --divider: #E4E7EC; --muted-bar: #8A94A6; --radius: 10px; --sidebar: 248px;
  --shadow: 0 8px 24px rgba(16,24,40,.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Inter", system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--primary); }
.ms { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: "FILL" 0, "wght" 400, "opsz" 24; user-select: none; flex-shrink: 0; }
.ms.fill { font-variation-settings: "FILL" 1, "wght" 400, "opsz" 24; }
.ms.sm { font-size: 18px; } .ms.xs { font-size: 16px; }

/* demo banner */
.demo-banner { background: #1D2226; color: #fff; font-size: 13px; padding: 8px 16px; display: flex; gap: 8px; align-items: center; justify-content: center; text-align: center; }
.demo-banner b { color: #8CC2F7; font-weight: 600; }

/* layout */
.shell { display: flex; min-height: calc(100vh - 37px); }
.sidebar { width: var(--sidebar); flex-shrink: 0; background: var(--paper); border-right: 1px solid var(--divider); display: flex; flex-direction: column; padding: 16px; position: sticky; top: 0; height: calc(100vh - 37px); }
.logo { display: flex; align-items: center; gap: 10px; padding: 12px 8px; margin-bottom: 16px; font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
.logo-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--primary); color: #fff; display: grid; place-items: center; }
.logo-mark .ms { font-size: 20px; }
.nav { display: grid; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 8px; text-decoration: none; color: var(--text); font-weight: 500; font-size: 14px; transition: background-color .15s; }
.nav a .ms { color: var(--text2); }
.nav a:hover { background: rgba(0,0,0,.04); }
.nav a.active { background: var(--primary-a08); color: var(--primary); }
.nav a.active .ms { color: var(--primary); }
.api-status { margin-top: auto; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--divider); height: 64px; display: flex; align-items: center; padding: 0 24px; gap: 16px; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn.menu-btn { display: none; }
.user-btn { display: flex; align-items: center; gap: 12px; border: 0; background: none; border-radius: 999px; padding: 4px 4px 4px 12px; cursor: pointer; font-weight: 600; }
.user-btn:hover { background: rgba(0,0,0,.04); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 15px; }
main { padding: 24px; display: grid; grid-template-columns: minmax(0,1fr); align-content: start; gap: 24px; max-width: 1440px; width: 100%; margin: 0 auto; }

/* typography */
h1, h2, h3 { margin: 0; }
.h5 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.33; }
.h6 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.5; }
.sub1 { font-size: 16px; font-weight: 600; line-height: 1.6; }
.sub2 { font-size: 14px; font-weight: 600; line-height: 1.57; }
.body2 { font-size: 14px; }
.caption { font-size: 12px; line-height: 1.66; }
.overline { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; line-height: 2.2; }
.muted { color: var(--text2); }
.page-sub { color: var(--text2); font-size: 16px; margin-top: 2px; }
.nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnum { font-variant-numeric: tabular-nums; }

/* primitives */
.card { background: var(--paper); border: 1px solid var(--divider); border-radius: var(--radius); }
.card-head { padding: 16px 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.divider { height: 1px; background: var(--divider); border: 0; margin: 0; }
.row { display: flex; align-items: center; gap: 12px; }
.stack { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 6px 16px; font-weight: 600; font-size: 14px; line-height: 1.75; border: 1px solid transparent; background: none; color: var(--primary); cursor: pointer; text-decoration: none; transition: background-color .15s, border-color .15s; white-space: nowrap; }
.btn .ms { font-size: 20px; margin: 0 -2px; }
.btn:hover { background: var(--primary-a08); }
.btn.contained { background: var(--primary); color: #fff; }
.btn.contained:hover { background: var(--primary-dark); }
.btn.outlined { border-color: rgba(10,102,194,.5); }
.btn.outlined:hover { border-color: var(--primary); }
.btn.success { color: var(--success); border-color: rgba(5,118,66,.5); }
.btn.danger { color: var(--error); }
.btn.danger.contained { background: var(--error); color: #fff; }
.btn.lg { padding: 8px 22px; font-size: 15px; }
.btn.sm { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; background: none; }
.btn.contained:disabled { background: rgba(0,0,0,.12); color: rgba(0,0,0,.38); opacity: 1; }
.btn.success:disabled { opacity: .85; color: var(--success); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; display: inline-grid; place-items: center; cursor: pointer; color: var(--text2); position: relative; text-decoration: none; }
.icon-btn:hover { background: rgba(0,0,0,.05); }
.icon-btn.sm { width: 28px; height: 28px; }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.badge { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 13px; font-weight: 500; background: var(--bg); color: var(--text); border: 1px solid transparent; white-space: nowrap; }
.chip.outlined { background: none; border-color: #C4CBD6; }
.chip .ms { font-size: 16px; margin-left: -3px; color: var(--text2); }
.chip.primary { background: var(--primary); color: #fff; }
.chip.lg { height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; cursor: pointer; }
.chip.toggle { cursor: pointer; background: none; border-color: #C4CBD6; height: 32px; padding: 0 12px; border-radius: 16px; }
.chip.toggle.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.toggle.on .ms { color: #fff; }
.chip.err { background: rgba(201,55,44,.1); color: var(--error); }
.chip .x { cursor: pointer; font-size: 16px; color: inherit; opacity: .7; margin-right: -4px; margin-left: 2px; }
.alert { display: flex; gap: 12px; align-items: center; padding: 8px 16px; border-radius: 8px; font-size: 14px; }
.alert > .ms { align-self: flex-start; margin-top: 7px; }
.alert { flex-wrap: wrap; }
.alert .alert-body { flex: 1 1 220px; padding: 6px 0; }
.alert.info { background: #E5F1FB; color: #0B3B66; } .alert.info > .ms { color: var(--primary); }
.alert.success { background: #E6F4EC; color: #08391F; } .alert.success > .ms { color: var(--success); }
.alert.warning { background: #FFF4E0; color: #5C3A00; } .alert.warning > .ms { color: var(--warning); }
.alert.error { background: #FCEBEA; color: #6B1C16; } .alert.error > .ms { color: var(--error); }
.alert .btn { color: inherit; }
.progress { height: 6px; border-radius: 3px; background: var(--divider); overflow: hidden; }
.progress > div { height: 100%; border-radius: 3px; background: var(--primary); transition: width .3s ease; }
.co-av { border-radius: 8px; display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
.ring { position: relative; display: inline-grid; place-items: center; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; }
.search { position: relative; width: 100%; }
.search .ms { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 20px; }
.search input { width: 100%; height: 40px; border: 1px solid #C4CBD6; border-radius: 999px; padding: 0 16px 0 40px; font: inherit; background: var(--paper); outline: none; }
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.input, select.input { height: 40px; border: 1px solid #C4CBD6; border-radius: 8px; padding: 0 12px; font: inherit; background: var(--paper); color: var(--text); outline: none; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 48px 20px; color: var(--text2); }
.list-row { padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
.clickable { cursor: pointer; transition: background-color .15s; }
.clickable:hover { background: var(--bg); }
.pager { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; }
.pager button { min-width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; cursor: pointer; font-size: 14px; }
.pager button:hover { background: rgba(0,0,0,.05); }
.pager button.on { background: var(--primary); color: #fff; }
.pager.sm button { min-width: 26px; height: 26px; border-radius: 13px; font-size: 13px; }
.pager.sm button.on { background: rgba(0,0,0,.08); color: var(--text); }
.pager button:disabled { opacity: .35; cursor: default; background: none; }
.tooltip-wrap[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: rgba(29,34,38,.92); color: #fff; font-size: 11px; font-weight: 500; padding: 4px 8px; border-radius: 4px; white-space: nowrap; pointer-events: none; z-index: 30; }

/* dashboard */
.metrics { display: grid; gap: 16px; grid-template-columns: repeat(4, 1fr); }
.metric { padding: 16px; display: flex; align-items: center; gap: 16px; }
.metric-ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
.charts { display: grid; gap: 24px; grid-template-columns: repeat(2, minmax(0,1fr)); }
.chart-body { padding: 20px; flex: 1; }
.skills { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.skills li { display: grid; grid-template-columns: minmax(84px,120px) minmax(0,1fr) auto; align-items: center; gap: 12px; }
.bar-track { height: 10px; background: var(--bg); border-radius: 0 4px 4px 0; }
.bar { height: 100%; background: var(--primary); border-radius: 0 4px 4px 0; transition: width .4s ease; }
.hist { position: relative; height: 170px; margin-top: 8px; }
.hist-bars { position: absolute; inset: 0 0 20px 0; display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; border-bottom: 1px solid var(--divider); }
.hist-col { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.hist-stack { width: 56%; max-width: 40px; display: flex; flex-direction: column; gap: 2px; }
.hist-line { position: absolute; top: 0; bottom: 20px; border-left: 2px dashed var(--text2); z-index: 1; pointer-events: none; transition: left .3s; }
.hist-line span { position: absolute; top: -4px; white-space: nowrap; background: var(--paper); color: var(--text2); font-size: 12px; font-weight: 500; padding: 0 4px; }
.hist-axis { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(6, 1fr); }
.hist-axis span { text-align: center; font-size: 12px; color: var(--text2); line-height: 20px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; color: var(--text2); font-size: 12px; }
.legend > span { display: inline-flex; gap: 6px; align-items: center; }
.sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.kanban { display: grid; gap: 16px; grid-template-columns: repeat(5, minmax(240px, 1fr)); overflow-x: auto; padding-bottom: 8px; }
.kcol { background: var(--col); border-radius: var(--radius); padding: 12px; min-height: 220px; display: flex; flex-direction: column; outline: 2px dashed transparent; transition: background-color .15s, outline-color .15s; min-width: 0; }
.kcol-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; margin-bottom: 12px; }
.kcount { margin-left: auto; padding: 0 8px; border-radius: 999px; background: var(--paper); color: var(--text2); font-weight: 600; font-size: 12px; }
.kcard { padding: 12px; cursor: pointer; transition: box-shadow .15s, transform .15s; display: flex; align-items: center; gap: 10px; }
.kcard:hover { box-shadow: 0 4px 12px rgba(16,24,40,.08); transform: translateY(-1px); }
.kcard.dragging { opacity: .5; }

/* jobs */
.job-row { padding: 16px 20px; display: flex; align-items: center; gap: 16px; transition: background-color .15s; }
.job-row:hover { background: var(--bg); }
.job-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }

/* resumes */
.drop { padding: 40px; text-align: center; border: 2px dashed var(--divider); transition: border-color .15s, background-color .15s; }
.drop.over { border-color: var(--primary); background: rgba(10,102,194,.04); }
.drop-ic { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; color: var(--primary); background: var(--primary-a08); }
.file-ic { width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; }

/* interviews */
.stats { display: flex; gap: 16px; flex-wrap: wrap; }
.stat { padding: 12px 20px; min-width: 150px; }
.bands { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0,1fr)); }
.bands li { display: flex; gap: 10px; align-items: flex-start; }
.feedback-grid { margin-top: 16px; display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0,1fr)); }
.feedback { padding: 14px; border-radius: 8px; border: 1px solid var(--divider); background: var(--bg); }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* preparation */
.alt { display: flex; align-items: flex-start; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 8px; border: 1px solid var(--divider); cursor: pointer; transition: border-color .15s; }
.alt:hover { border-color: #C4CBD6; }
.alt input { margin: 3px 4px 0 6px; accent-color: var(--primary); width: 16px; height: 16px; flex-shrink: 0; }
.alt.correct { border-color: var(--success); background: rgba(5,118,66,.08); }
.alt.wrong { border-color: var(--error); background: rgba(201,55,44,.08); }
.alt.locked { cursor: default; }
.company-grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0,1fr)); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--primary-a12); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
.spinner.sm { width: 16px; height: 16px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* settings */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--divider); margin-top: -8px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 16px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--primary); border-bottom-color: var(--primary); }
.set-body { padding: 8px 24px; }
.field { display: grid; grid-template-columns: minmax(200px,1fr) minmax(0,2fr); gap: 32px; padding: 16px 0; }
.field + .field { border-top: 1px solid var(--divider); }
.presets { margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.preset { text-align: left; cursor: pointer; padding: 12px; border-radius: 8px; border: 1px solid var(--divider); background: var(--paper); transition: border-color .15s, background-color .15s; }
.preset:hover { border-color: var(--primary); }
.preset.on { border-color: var(--primary); background: rgba(10,102,194,.06); }
input[type=range] { width: 100%; accent-color: var(--primary); height: 24px; }
.marks { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-top: 2px; }
.save-bar { position: sticky; bottom: 24px; max-width: 960px; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; transition: box-shadow .2s, border-color .2s; }
.save-bar.dirty { box-shadow: var(--shadow); border-color: var(--primary); }
.switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #C4CBD6; border-radius: 11px; cursor: pointer; transition: background .15s; }
.switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--primary); }
.switch input:checked + span::before { transform: translateX(18px); }
.tag-box { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid #C4CBD6; border-radius: 8px; padding: 6px 8px; min-height: 40px; }
.tag-box input { border: 0; outline: none; font: inherit; flex: 1; min-width: 120px; padding: 2px 4px; background: none; }
.tag-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

/* dialog */
.overlay { position: fixed; inset: 0; background: rgba(16,24,40,.5); z-index: 100; display: grid; place-items: center; padding: 32px 16px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--paper); border-radius: 12px; width: 100%; max-width: 600px; max-height: calc(100vh - 64px); display: flex; flex-direction: column; box-shadow: 0 24px 48px rgba(16,24,40,.25); animation: pop .18s ease-out; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.dialog-head { padding: 24px 24px 16px; display: flex; gap: 16px; align-items: center; }
.dialog-body { padding: 20px 24px; overflow-y: auto; border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); }
.dialog-actions { padding: 16px 24px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dl { margin: 0; display: grid; gap: 16px; grid-template-columns: repeat(2, 1fr); }
.dl dt { font-size: 12px; color: var(--text2); }
.dl dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.chat { display: flex; flex-direction: column; gap: 12px; min-height: 320px; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; }
.bubble.ai { background: var(--bg); border-top-left-radius: 4px; align-self: flex-start; }
.bubble.me { background: var(--primary); color: #fff; border-top-right-radius: 4px; align-self: flex-end; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text2); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.rec-btn { width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(10,102,194,.35); }
.rec-btn.on { background: var(--error); box-shadow: 0 0 0 0 rgba(201,55,44,.5); animation: pulse 1.4s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 12px rgba(201,55,44,0); } 100% { box-shadow: 0 0 0 0 rgba(201,55,44,0); } }
.menu-pop { position: absolute; right: 24px; top: 58px; background: var(--paper); border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--divider); min-width: 220px; z-index: 50; padding: 4px 0; }

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

}

  const color = COLORS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length]

}
function ring(pct, size, color, text, fontRatio = 0.26, label = '') {
  const sw = size * 0.08, r = (size - sw) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, pct)) / 100)

}
const matchBadge = (v, size = 48) => ring(v, size, matchColor(v), v + '%', 0.26, `Aderência de ${v}%`)
const scoreBadge = (v, size = 48) => ring(v == null ? 0 : v * 10, size, v == null ? C.divider : scoreColor(v), v == null ? '–' : fmtScore(v), 0.3, v == null ? 'Sem nota' : `Nota ${fmtScore(v)} de 10`)
function paginate(items, page, size) {
  const pageCount = Math.max(1, Math.ceil(items.length / size)), cur = Math.min(Math.max(1, page), pageCount), start = (cur - 1) * size, slice = items.slice(start, start + size)
  return { items: slice, page: cur, pageCount, from: slice.length ? start + 1 : 0, to: start + slice.length }
}
function pager(p, act, extra = '', small = false) {
  if (p.pageCount <= 1) return ''
  let pages = []
  for (let i = 1; i <= p.pageCount; i++) if (i === 1 || i === p.pageCount || Math.abs(i - p.page) <= (small ? 0 : 1)) pages.push(i); else if (pages[pages.length - 1] !== '…') pages.push('…')
  return `<div class="pager ${small ? 'sm' : ''}"><button data-act="${act}" data-page="${p.page - 1}" ${extra} ${p.page === 1 ? 'disabled' : ''} aria-label="Página anterior">${icon('chevron_left', 'sm')}</button>${pages.map((n) => n === '…' ? '<button disabled>…</button>' : `<button class="${n === p.page ? 'on' : ''}" data-act="${act}" data-page="${n}" ${extra} aria-label="Página ${n}">${n}</button>`).join('')}<button data-act="${act}" data-page="${p.page + 1}" ${extra} ${p.page === p.pageCount ? 'disabled' : ''} aria-label="Próxima página">${icon('chevron_right', 'sm')}</button></div>`
}
const matchesSearch = (j, q) => { q = norm(q.trim()); return !q || [j.company, j.role, j.location, WORK_MODE[j.workMode], ...j.tags].some((v) => norm(v).includes(q)) }
function isVisible(j, s = state.settings) {
  if (j.stage !== 'found') return true
  const text = norm([j.role, j.company, j.location, ...j.tags].join(' '))
  return j.match >= s.minMatch && s.workModes.includes(j.workMode) && !s.excludedKeywords.some((k) => text.includes(norm(k))) && Date.now() - j.postedAt <= s.maxJobAgeDays * 24 * H
}
const visibleJobs = () => state.jobs.filter((j) => isVisible(j))
const isCandidate = (j) => ['applied', 'interview', 'offer'].includes(j.stage)
let toastTimer
function toast(msg) {
  clearTimeout(toastTimer)
  document.querySelector('.toast')?.remove()
  const el = document.createElement('div'); el.className = 'toast'; el.role = 'status'; el.textContent = msg
  document.body.appendChild(el)
  toastTimer = setTimeout(() => el.remove(), 3200)
}

function topSkillsChart(jobs) {
  const counts = new Map()
  jobs.forEach((j) => new Set(j.tags).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)))
  const rows = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 8)
  const primary = state.resumes.find((r) => r.primary)
  const owned = new Set((primary?.ats?.tecnologiasIdentificadas || []).map(norm))
  const covered = rows.filter(([t]) => owned.has(norm(t))).length
  const max = rows[0]?.[1] || 1
  return `<section class="card stack" aria-label="Tecnologias mais pedidas">
    <div style="padding:16px 20px"><h2 class="h6">Tecnologias mais pedidas</h2><div class="body2 muted">Seu currículo principal cobre ${covered} das ${rows.length} tecnologias mais pedidas.</div></div>
    <hr class="divider"><div class="chart-body"><ol class="skills">${rows.map(([t, n]) => {
      const has = owned.has(norm(t))
      return `<li title="${esc(t)}: ${n} de ${jobs.length} vagas (${Math.round(n / jobs.length * 100)}%) · ${has ? 'no seu currículo' : 'fora do seu currículo'}">
      <div class="row" style="gap:6px;min-width:0">${has ? `<span class="ms fill xs" style="color:${C.success}" aria-label="No seu currículo">check_circle</span>` : `<span class="ms xs" style="color:var(--disabled)" aria-label="Fora do seu currículo">radio_button_unchecked</span>`}<span class="body2 nowrap" style="font-weight:500">${esc(t)}</span></div>
      <div class="bar-track"><div class="bar" style="width:${n / max * 100}%"></div></div>
      <span class="body2 muted tnum" style="min-width:72px;text-align:right">${plural(n, 'vaga', 'vagas')}</span></li>` }).join('')}</ol>
    <div class="legend"><span><span class="ms fill xs" style="color:${C.success};font-size:14px">check_circle</span>No seu currículo</span><span><span class="ms xs" style="color:var(--disabled);font-size:14px">radio_button_unchecked</span>Oportunidade de aprender</span></div></div></section>`
}
const BINS = [[0, 50, '<50%'], [50, 60, '50–59'], [60, 70, '60–69'], [70, 80, '70–79'], [80, 90, '80–89'], [90, 101, '90–100']]
function matchDistChart(jobs) {
  const min = state.settings.minMatch
  const bins = BINS.map(([f, t, l]) => { const inBin = jobs.filter((j) => j.match >= f && j.match < t); const above = inBin.filter((j) => j.match >= min).length; return { l, total: inBin.length, above, below: inBin.length - above } })
  const max = Math.max(1, ...bins.map((b) => b.total)), qualified = bins.reduce((s, b) => s + b.above, 0), pct = jobs.length ? Math.round(qualified / jobs.length * 100) : 0
  const idx = Math.max(0, BINS.findIndex(([f, t]) => min >= f && min < t)), frac = (min - BINS[idx][0]) / (BINS[idx][1] - BINS[idx][0])
  const x = (idx + Math.min(1, Math.max(0, frac))) / BINS.length * 100
  return `<section class="card stack" aria-label="Distribuição de compatibilidade">
    <div style="padding:16px 20px"><h2 class="h6">Distribuição de compatibilidade</h2><div class="body2 muted"><strong style="color:var(--text)">${qualified} de ${jobs.length} vagas (${pct}%)</strong> atingem seu mínimo de ${min}%. <a href="#/configuracoes" style="font-weight:500">Ajustar</a></div></div>
    <hr class="divider"><div class="chart-body"><div class="hist">
      <div class="hist-line" style="left:${x}%"><span style="${x > 70 ? 'right:6px' : 'left:6px'}">mínimo ${min}%</span></div>
      <div class="hist-bars" role="list" aria-label="Vagas por faixa de compatibilidade">${bins.map((b) => {
        const h = b.total / max * 122, ah = b.total ? b.above / b.total * h : 0, bh = h - ah
        return `<div class="hist-col" role="listitem" title="${b.l}: ${plural(b.total, 'vaga', 'vagas')} (${b.above} acima do mínimo)" aria-label="${b.l}: ${b.total} vagas, ${b.above} acima do mínimo"><span class="caption muted tnum" style="margin-bottom:4px">${b.total}</span><div class="hist-stack" style="gap:${ah && bh ? 2 : 0}px">${ah ? `<div style="height:${ah}px;background:var(--primary);border-radius:4px 4px 0 0"></div>` : ''}${bh ? `<div style="height:${bh}px;background:var(--muted-bar);border-radius:${ah ? 0 : '4px 4px 0 0'}"></div>` : ''}</div></div>` }).join('')}</div>
      <div class="hist-axis" aria-hidden="true">${bins.map((b) => `<span>${b.l}</span>`).join('')}</div></div>
    <div class="legend"><span><span class="sq" style="background:var(--primary)"></span>Atinge o mínimo</span><span><span class="sq" style="background:var(--muted-bar)"></span>Abaixo do mínimo</span></div></div></section>`
}

function uploadFiles(files) {
  [...files].forEach((f) => {
    if (!/\.(pdf|docx?)$/i.test(f.name)) return toast(`"${f.name}" não é PDF, DOC ou DOCX.`)
    const r = { id: 'r' + Math.random().toString(36).slice(2, 7), name: f.name, size: f.size, primary: false, createdAt: Date.now(), ats: null, uploading: 0 }
    state.resumes.unshift(r); render()
    const tick = setInterval(() => {
      r.uploading = Math.min(100, r.uploading + 12 + Math.random() * 20)
      if (r.uploading >= 100) { clearInterval(tick); delete r.uploading; toast(`"${f.name}" enviado.`) }
      if (route().path === '/curriculos') render()
      else clearInterval(tick), delete r.uploading
    }, 220)
  })
}

function pagePrepPicker() {

  return `
  <div><h1 class="h5">Preparatório</h1><p class="page-sub" style="margin:0">Escolha uma vaga em que você é candidato para estudar a empresa e testar o que você sabe sobre o conteúdo da vaga.</p></div>
  <section class="card" aria-label="Vagas para se preparar">${jobs.length ? jobs.map((j, i) => {
    const s = STAGES.find((x) => x.id === j.stage), prep = state.preps[j.id]
    return `${i ? '<hr class="divider">' : ''}<a class="list-row clickable" href="#/preparatorio/${j.id}" style="text-decoration:none;color:inherit">${coAvatar(j.company, 40)}
      <div class="grow"><div class="sub2 nowrap">${esc(j.role)}</div><div class="body2 muted nowrap">${esc(j.company)} · ${esc(j.location)} · ${WORK_MODE[j.workMode]}</div></div>
      ${prep?.score != null ? `<span class="caption muted hide-xs">última nota ${fmtScore(prep.score)}</span>` : ''}
      <span class="chip outlined hide-xs" style="color:${s.color};border-color:${s.color}">${s.label}</span><span class="ms" style="color:var(--text2)">chevron_right</span></a>` }).join('')
    : `<div class="empty">${icon('school')}<div class="sub1" style="color:var(--text)">Nenhuma vaga para se preparar</div><div class="body2">Aparecem aqui as vagas em que você é candidato.</div><a class="btn contained" href="#/vagas">Ver vagas</a></div>`}</section>
  <div class="body2 muted tnum">1–${jobs.length} de ${plural(jobs.length, 'vaga', 'vagas')}</div>`
}
const exam = { answers: {}, result: null, generating: false }
function pagePrep(jobId) {
  const j = jobById(jobId), back = `<div><a class="btn" href="#/preparatorio">${icon('arrow_back')}Preparatório</a></div>`
  if (!j) return back + `<div class="alert warning">${icon('warning')}<div class="alert-body">Vaga não encontrada.</div></div>`
  if (!isCandidate(j)) return back + `<div class="alert info">${icon('info')}<div class="alert-body">O preparatório é só para vagas em que você é candidato. Mova “${esc(j.role)}” para Candidatado no pipeline para se preparar para ela.</div></div>`
  const prep = state.preps[jobId]
  let body
  if (exam.generating) body = `<div class="card" style="padding:32px"><div class="stack" style="align-items:center;text-align:center;gap:12px" role="status"><div class="spinner"></div><div class="sub1">Gerando o preparatório…</div><div class="body2 muted">A IA está pesquisando a empresa e montando perguntas sobre ${esc(j.tags.slice(0, 3).join(', '))}.</div></div></div>`
  else if (!prep) body = `<div class="card" style="padding:32px"><div class="stack" style="align-items:center;text-align:center;gap:12px"><span class="ms" style="font-size:44px;color:var(--primary)">school</span><h2 class="h6">Prepare-se para esta vaga</h2><div class="body2 muted" style="max-width:440px">Gere um resumo da empresa e uma prova com perguntas sobre as tecnologias pedidas.</div><button class="btn contained lg" data-act="gen-prep" data-job="${j.id}" style="margin-top:8px">${icon('auto_awesome')}Gerar preparatório</button></div></div>`
  else body = companyCard(prep.company) + examView(j, prep)
  return `${back}
  <section class="card" style="padding:24px" aria-label="Vaga">
    <div class="row stack-xs" style="gap:20px"><div class="row grow" style="gap:16px">${coAvatar(j.company, 48)}<div style="min-width:0"><h1 class="h5" style="overflow-wrap:anywhere">${esc(j.role)}</h1><div class="muted">${esc(j.company)} · ${esc(j.location)} · ${WORK_MODE[j.workMode]}</div></div></div>
      ${prep?.score != null ? `<div class="stack" style="align-items:center">${scoreBadge(prep.score, 64)}<span class="caption muted">Última nota</span></div>` : matchBadge(j.match, 56)}</div>
    <div class="row wrap" style="gap:6px;margin-top:16px">${j.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
    ${prep && !exam.generating ? `<div style="margin-top:20px"><button class="btn" data-act="gen-prep" data-job="${j.id}">${icon('refresh')}Gerar novo preparatório</button></div>` : ''}

function companyCard(co) {
  const labels = { o_que_faz: 'O que faz', produtos_servicos: 'Produtos e serviços', fundacao: 'Fundação', tempo_de_mercado: 'Tempo de mercado', cultura: 'Cultura' }
  const { nome, ...rest } = co
  return `<section class="card" style="padding:24px" aria-labelledby="company-title"><div class="row" style="gap:8px;margin-bottom:16px"><span class="ms" style="color:var(--primary)">business</span><h2 class="h6" id="company-title">Sobre a ${esc(nome)}</h2></div>
    <div class="company-grid">${Object.entries(rest).map(([k, v]) => `<div><h3 class="sub2" style="margin-bottom:4px">${labels[k] || k}</h3>${Array.isArray(v) ? `<ul style="margin:0;padding-left:18px" class="body2">${v.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : `<div class="body2">${esc(v)}</div>`}</div>`).join('')}</div></section>`
}
function examView(j, prep) {
  const total = prep.questions.length, answered = Object.keys(exam.answers).length, res = exam.result
  return `<section class="stack" style="gap:16px" aria-labelledby="exam-title" id="exam-top">
    <div class="row" style="gap:8px"><span class="ms" style="color:var(--primary)">quiz</span><h2 class="h6 grow" id="exam-title">Prova</h2><span class="body2 muted tnum">${res ? `${res.acertos} de ${total} certas` : `${answered} de ${total} respondidas`}</span></div>
    ${res ? `<div class="alert ${res.score >= 7 ? 'success' : res.score >= 5 ? 'warning' : 'error'}">${icon(res.score >= 7 ? 'check_circle' : 'info')}<div class="alert-body"><div class="sub2">Nota ${fmtScore(res.score)} de 10</div>Você acertou ${res.acertos} de ${total} perguntas. A nota foi salva.</div><button class="btn sm" data-act="exam-restart">${icon('replay', 'sm')}Refazer</button></div>`
      : `<div class="progress" aria-label="${answered} de ${total} perguntas respondidas"><div style="width:${answered / total * 100}%"></div></div>`}
    ${prep.questions.map((q) => {
      const sel = exam.answers[q.numero], ok = res && sel === q.correta
      return `<div class="card" style="padding:20px"><div class="row" style="align-items:flex-start;gap:8px"><div class="grow"><div class="caption muted" style="font-weight:600">Pergunta ${q.numero} · ${esc(q.tecnologia)} · ${esc(q.nivel)}</div><div class="sub1">${esc(q.pergunta)}</div></div>
        ${res ? (ok ? `<span class="ms fill" style="color:${C.success}" aria-label="Resposta certa">check_circle</span>` : `<span class="ms fill" style="color:${C.error}" aria-label="Resposta errada">cancel</span>`) : ''}</div>
        <div class="stack" style="gap:6px;margin-top:8px" role="radiogroup">${q.alternativas.map((a) => {
          const cls = res ? (a.letra === q.correta ? 'correct' : a.letra === sel ? 'wrong' : '') : ''
          return `<label class="alt ${cls} ${res ? 'locked' : ''}"><input type="radio" name="q${q.numero}" value="${a.letra}" data-q="${q.numero}" ${sel === a.letra ? 'checked' : ''} ${res ? 'disabled' : ''}><span class="body2"><b style="margin-right:6px">${a.letra})</b>${esc(a.texto)}</span></label>` }).join('')}</div>
        ${res ? `<div class="alert ${ok ? 'success' : 'info'}" style="margin-top:12px">${icon('lightbulb')}<div class="alert-body">${ok ? '' : `<div class="sub2">Resposta certa: ${q.correta}</div>`}${esc(q.explicacao)}</div></div>` : ''}</div>` }).join('')}
    <div class="row wrap" style="justify-content:flex-end;gap:12px">${res ? `<button class="btn contained" data-act="exam-restart">${icon('replay')}Refazer prova</button>`
      : `${answered < total ? '<span class="body2 muted">Responda todas as perguntas para enviar.</span>' : ''}<button class="btn contained" data-act="exam-submit" data-job="${j.id}" ${answered < total ? 'disabled' : ''}>${icon('send')}Enviar prova</button>`}</div>
  </section>`
}

    <div class="dialog-body"><div class="stack" style="gap:24px">
      <div class="row" style="gap:20px">${ring(a.atsScore, 88, col, `${a.atsScore}<small style="font-size:12px;color:var(--text2);font-weight:400">/100</small>`, 0.27, `Nota ATS ${a.atsScore} de 100`)}<div><div class="overline muted">Compatibilidade com ATS</div><div class="sub1">${esc(a.classificacao)}</div></div></div>
      ${sec('Pontos fortes', 'check_circle', C.success, a.pontosFortes)}${sec('Pontos fracos', 'report_problem', C.warning, a.pontosFracos)}${sec('Sugestões', 'lightbulb', C.primary, a.sugestoes)}
      <section><h3 class="sub2" style="margin-bottom:8px">Tecnologias identificadas</h3><div class="row wrap" style="gap:6px">${a.tecnologiasIdentificadas.map((t) => `<span class="chip outlined">${esc(t)}</span>`).join('')}</div></section>
    </div></div><div class="dialog-actions"><button class="btn" data-act="close">Fechar</button></div>`)
}
function confirmDialog(title, text, onOk) {
  openDialog(`<div style="padding:20px 24px 8px"><h2 class="h6">${title}</h2></div><div style="padding:0 24px 12px" class="muted">${text}</div><div class="dialog-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn danger contained" id="confirm-ok">Excluir</button></div>`)
  layer.querySelector('#confirm-ok').onclick = () => { closeDialog(); onOk() }
}
function generateDialog() {
  const primary = state.resumes.find((r) => r.primary)
  openDialog(`<div style="padding:20px 24px 8px"><h2 class="h6">Gerar vagas</h2><div class="body2 muted">A IA busca vagas nas principais plataformas e calcula a compatibilidade com o currículo escolhido.</div></div>
    <div class="dialog-body"><div class="stack" style="gap:8px">${state.resumes.filter((r) => r.uploading == null).map((r) => `<label class="alt"><input type="radio" name="gen-r" value="${r.id}" ${r === primary ? 'checked' : ''}><span class="body2"><b>${esc(r.name)}</b>${r.primary ? ' · principal' : ''}</span></label>`).join('')}</div></div>
    <div class="dialog-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn contained" data-act="gen-run">${icon('travel_explore')}Buscar vagas</button></div>`)
}
const NEW_JOBS = [
  ['Aurora Labs', 'Desenvolvedora React Sênior', 'Brasil', 'remote', 93, ['React', 'TypeScript', 'Next.js', 'Jest']],
  ['Cobalto Pagamentos', 'Engenheira Full Stack', 'São Paulo, SP', 'hybrid', 89, ['Node.js', 'React', 'PostgreSQL', 'AWS']],
  ['Farol Analytics', 'Frontend Developer Pleno', 'Brasil', 'remote', 80, ['React', 'D3.js', 'TypeScript', 'CSS']],
]
function runGenerate() {
  closeDialog(); toast('Busca de vagas iniciada. Novas vagas aparecem em alguns segundos…')
  setTimeout(() => {
    NEW_JOBS.splice(0).forEach((a, i) => state.jobs.push(job(...a, 'found', 0.2 + i * 0.1)))
    toast('3 novas vagas compatíveis encontradas!'); render()
  }, 2200)
}

/* ---------- simulação de entrevista ---------- */
const sim = { job: null, msgs: [], step: 0, recording: false, secs: 0, timer: null, typing: false, done: false, analyzing: false, report: null }
function startInterview(id) {
  Object.assign(sim, { job: jobById(id), msgs: [], step: 0, recording: false, secs: 0, typing: false, done: false, analyzing: false, report: null })
  openDialog(`<div class="dialog-head" style="padding-bottom:12px"><div class="avatar" style="background:var(--primary-a08);color:var(--primary)">${icon('record_voice_over', 'sm')}</div><div class="grow"><span class="sub1" style="display:block">Simulação de entrevista</span><span class="body2 muted nowrap" style="display:block">${esc(sim.job.role)} · ${esc(sim.job.company)}</span></div><button class="icon-btn" data-act="close" aria-label="Fechar simulação">${icon('close')}</button></div>
    <div class="dialog-body" id="chat-scroll" style="min-height:340px"><div class="chat" id="chat" aria-live="polite"></div></div><div class="dialog-actions" id="sim-actions" style="justify-content:center"></div>`,
  () => { clearInterval(sim.timer); sim.job = null })
  interviewerSay(`Olá, ${USER.name}! Sou o entrevistador virtual da ${sim.job.company}. Vou fazer 4 perguntas; grave a resposta de cada uma como se fosse a entrevista real.`, () => interviewerSay(QUESTIONS[0]))
}
function interviewerSay(text, then) {
  sim.typing = true; drawSim()
  setTimeout(() => { if (!sim.job) return; sim.typing = false; sim.msgs.push({ role: 'ai', text }); drawSim(); then && setTimeout(then, 500) }, 900)
}
function drawSim() {
  const chat = document.getElementById('chat'); if (!chat) return
  chat.innerHTML = sim.msgs.map((m) => m.role === 'ai' ? `<div class="bubble ai"><span class="caption muted" style="display:block;font-weight:600">Entrevistador</span>${esc(m.text)}</div>` : `<div class="bubble me"><span class="caption" style="display:block;font-weight:600;opacity:.85">Você</span>${icon('graphic_eq', 'xs')} ${esc(m.text)}</div>`).join('')
    + (sim.typing ? '<div class="bubble ai"><span class="typing"><i></i><i></i><i></i></span></div>' : '')
  const sc = document.getElementById('chat-scroll'); sc.scrollTop = sc.scrollHeight
  const act = document.getElementById('sim-actions'), mmss = `${Math.floor(sim.secs / 60)}:${String(sim.secs % 60).padStart(2, '0')}`
  if (sim.report) act.innerHTML = `<div class="stack" style="align-items:center;gap:12px;width:100%"><div class="row" style="gap:12px">${scoreBadge(sim.report.notaGeral, 56)}<div><div class="sub2">Relatório pronto</div><div class="body2 muted">${scoreLevel(sim.report.notaGeral)}</div></div></div><a class="btn contained" href="#/entrevistas/${sim.report.id}" data-act="close">${icon('assessment')}Ver relatório</a></div>`
  else if (sim.analyzing) act.innerHTML = `<div class="row" style="gap:12px"><div class="spinner sm"></div><span class="body2 muted">Analisando suas respostas com IA…</span></div>`
  else if (sim.done) act.innerHTML = ''
  else act.innerHTML = `<div class="stack" style="align-items:center;gap:8px"><button class="rec-btn ${sim.recording ? 'on' : ''}" data-act="rec" ${sim.typing ? 'disabled style="opacity:.5"' : ''} aria-label="${sim.recording ? 'Parar gravação' : 'Gravar resposta'}">${icon(sim.recording ? 'stop' : 'mic')}</button>
    <span class="body2 ${sim.recording ? '' : 'muted'} tnum" style="${sim.recording ? `color:${C.error};font-weight:600` : ''}">${sim.recording ? `Gravando… ${mmss} · toque para enviar` : sim.typing ? 'Aguarde a pergunta…' : `Pergunta ${sim.step + 1} de 4 · toque para gravar`}</span></div>`
}
function toggleRec() {
  if (sim.typing || sim.done) return
  if (!sim.recording) {
    sim.recording = true; sim.secs = 0
    sim.timer = setInterval(() => { sim.secs++; drawSim() }, 1000); drawSim(); return
  }
  clearInterval(sim.timer); sim.recording = false
  const len = Math.max(sim.secs, 8 + Math.floor(Math.random() * 40))
  sim.msgs.push({ role: 'me', text: `Resposta gravada (${Math.floor(len / 60)}:${String(len % 60).padStart(2, '0')})` })
  sim.step++
  if (sim.step < 4) return interviewerSay(QUESTIONS[sim.step])
  sim.done = true
  interviewerSay('Obrigado pela conversa! Encerramos a entrevista com 4 respostas gravadas.', () => {
    sim.analyzing = true; drawSim()
    setTimeout(() => {
      if (!sim.job) return
      const base = 6 + Math.random() * 3
      const rep = makeReport(sim.job, [0, 1, 2, 3].map(() => Math.round(Math.min(10, Math.max(4, base + (Math.random() - 0.5) * 3)) * 2) / 2), 0)
      state.reports.push(rep); sim.analyzing = false; sim.report = rep; drawSim()
    }, 2200)
  })
}

/* ============================== roteamento e render ============================== */
function route() { const h = location.hash.replace(/^#/, '') || '/'; return { path: h, parts: h.split('/').filter(Boolean) } }
let lastPath = null
function render() {
  const { path, parts } = route()
  if (lastPath !== path) { exam.answers = {}; exam.result = null; exam.generating = false }
  renderChrome(path)
  let html
  if (parts[0] === 'vagas') html = pageJobs()
  else if (parts[0] === 'curriculos') html = pageResumes()
  else if (parts[0] === 'entrevistas') html = parts[1] ? pageReport(parts[1]) : pageInterviews()
  else if (parts[0] === 'preparatorio') html = parts[1] ? pagePrep(parts[1]) : pagePrepPicker()
  else if (parts[0] === 'configuracoes') html = pageSettings()
  else html = pageDashboard()
  const main = document.getElementById('main')
  main.innerHTML = html
  if (lastPath !== path) { window.scrollTo(0, 0); lastPath = path; document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').classList.remove('open') }
  refreshSaveBar()
}
window.addEventListener('hashchange', () => {
  if (state.draft && isDirty() && !location.hash.startsWith('#/configuracoes')) { toast('Alterações não salvas foram descartadas.'); state.draft = null }
  if (!location.hash.startsWith('#/configuracoes')) state.draft = null
  render()
})

/* ---------- eventos ---------- */
function moveJob(id, stage) {
  const j = jobById(id); if (!j || j.stage === stage) return
  j.stage = stage; j.updatedAt = Date.now()
  toast(`“${j.role}” movida para ${STAGES.find((s) => s.id === stage).label}`)
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]')
  const pop = document.querySelector('.menu-pop')
  if (pop && !e.target.closest('.menu-pop')) pop.remove()
  if (!el) return
  const act = el.dataset.act, id = el.dataset.job || el.dataset.id
  switch (act) {
    case 'overlay': if (e.target === el) closeDialog(); break
    case 'close': closeDialog(); break
    case 'open-menu': document.getElementById('sidebar').classList.add('open'); document.getElementById('backdrop').classList.add('open'); break
    case 'user-menu': {
      if (pop) break
      e.stopPropagation()
      const m = document.createElement('div'); m.className = 'menu-pop'; m.role = 'menu'
      m.innerHTML = `<div style="padding:8px 16px"><div class="caption muted">Conectado como</div><div class="sub2">${USER.email}</div></div><hr class="divider"><button class="mi" data-act="demo-only">${icon('logout', 'sm')}Sair</button>`
      document.querySelector('.topbar').appendChild(m); break
    }
    case 'details': if (e.target.closest('[data-act="interview"]')) break; detailsDialog(id); break
    case 'interview': e.stopPropagation(); startInterview(id); break
    case 'kpage': state.ui.kanbanPages[el.dataset.stage] = +el.dataset.page; document.getElementById('kanban').innerHTML = kanbanCols(); break
    case 'jpage': state.ui.jobPage = +el.dataset.page; document.getElementById('joblist').innerHTML = jobList(); window.scrollTo({ top: 0, behavior: 'smooth' }); break
    case 'apply': { const j = jobById(id); el.disabled = true; el.textContent = 'Aplicando…'; setTimeout(() => { j.stage = 'applied'; j.updatedAt = Date.now(); toast(`Candidatura enviada para ${j.company}`); document.getElementById('joblist').innerHTML = jobList(); renderChrome(route().path) }, 600); break }
    case 'toggle-all': state.ui.showAll = !state.ui.showAll; state.ui.jobPage = 1; render(); break
    case 'generate': generateDialog(); break
    case 'gen-run': runGenerate(); break
    case 'pick-file': document.getElementById('file-input').click(); break
    case 'primary': state.resumes.forEach((r) => (r.primary = r.id === id)); toast(`"${state.resumes.find((r) => r.id === id).name}" agora é o currículo principal.`); render(); break
    case 'ats': atsDialog(id); break
    case 'download': toast('Download desativado na demonstração.'); break
    case 'del-resume': { const r = state.resumes.find((x) => x.id === id); confirmDialog('Remover currículo?', `“${esc(r.name)}” será apagado.`, () => { state.resumes = state.resumes.filter((x) => x !== r); if (r.primary && state.resumes[0]) state.resumes[0].primary = true; toast(`"${r.name}" removido.`); render() }); break }
    case 'del-report': confirmDialog('Excluir relatório?', 'O relatório e os áudios gravados desta entrevista serão apagados.', () => { state.reports = state.reports.filter((x) => x.id !== id); location.hash = '#/entrevistas' }); break
    case 'gen-prep': exam.generating = true; exam.answers = {}; exam.result = null; render(); setTimeout(() => { state.preps[id] = buildPrep(jobById(id)); exam.generating = false; if (route().path === '/preparatorio/' + id) render() }, 2000); break
    case 'exam-submit': {
      const prep = state.preps[id], acertos = prep.questions.filter((q) => exam.answers[q.numero] === q.correta).length
      exam.result = { acertos, score: Math.round(acertos / prep.questions.length * 100) / 10 }; prep.score = exam.result.score
      render(); document.getElementById('exam-top')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break
    }
    case 'exam-restart': exam.answers = {}; exam.result = null; render(); document.getElementById('exam-top')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break
    case 'tab': state.ui.settingsTab = el.dataset.tab; if (route().parts[0] === 'configuracoes') render(); break
    case 'preset': setMinMatch(+el.dataset.val, true); break
    case 'toggle-opt': { const arr = state.draft[el.dataset.key], v = el.dataset.val; state.draft[el.dataset.key] = arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]; render(); break }
    case 'rm-tag': state.draft[el.dataset.key].splice(+el.dataset.i, 1); render(); break
    case 'discard': state.draft = clone(state.settings); render(); break
    case 'save': state.settings = { ...clone(state.draft), updatedAt: Date.now() }; state.draft = clone(state.settings); toast('Configurações salvas e aplicadas.'); render(); break
    case 'rec': toggleRec(); break
    case 'demo-link': toast('Na versão real, abre a vaga no site de origem.'); break
    case 'demo-only': document.querySelector('.menu-pop')?.remove(); toast('Ação desativada na demonstração.'); break
  }
})
document.getElementById('backdrop').addEventListener('click', () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').classList.remove('open') })
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && layer.innerHTML) closeDialog()
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('kcard')) { e.preventDefault(); detailsDialog(e.target.dataset.job) }
  if (e.key === 'Enter' && e.target.dataset?.tag) {
    e.preventDefault(); const v = e.target.value.trim(), key = e.target.dataset.tag
    if (v && !state.draft[key].some((x) => norm(x) === norm(v))) { state.draft[key].push(v); render(); document.querySelector(`[data-tag="${key}"]`)?.focus() }
  }
})
document.addEventListener('input', (e) => {
  const t = e.target
  if (t.id === 'kanban-search') { state.ui.kanbanSearch = t.value; state.ui.kanbanPages = {}; document.getElementById('kanban').innerHTML = kanbanCols() }
  else if (t.id === 'job-search') { state.ui.jobSearch = t.value; state.ui.jobPage = 1; document.getElementById('joblist').innerHTML = jobList() }
  else if (t.id === 'min-match') setMinMatch(+t.value, false)
  else if (t.dataset.num === 'minSalary') { state.draft.minSalary = t.value === '' ? null : Math.max(0, Math.trunc(+t.value)); refreshSaveBar() }
})
document.addEventListener('change', (e) => {
  const t = e.target
  if (t.id === 'job-stage') { moveJob(t.dataset.job, t.value); render(); detailsDialog(t.dataset.job) }
  else if (t.dataset.act === 'page-size') { state.ui.pageSize = +t.value; state.ui.jobPage = 1; document.getElementById('joblist').innerHTML = jobList() }
  else if (t.dataset.q) { exam.answers[t.dataset.q] = t.value; const { parts } = route(); const prep = state.preps[parts[1]]; const top = window.scrollY; render(); window.scrollTo(0, top); void prep }
  else if (t.dataset.num === 'maxJobAgeDays') { state.draft.maxJobAgeDays = +t.value; refreshSaveBar() }
  else if (t.dataset.bool) { state.draft[t.dataset.bool] = t.checked; refreshSaveBar() }
  else if (t.id === 'file-input') { uploadFiles(t.files); t.value = '' }
})
function setMinMatch(v, rerender) {
  state.draft.minMatch = v
  if (rerender) return render()
  const col = matchColor(v), out = document.getElementById('mm-val')
  out.textContent = v + '%'; out.style.color = col
  document.getElementById('min-match').style.accentColor = col
  document.getElementById('mm-desc').textContent = describeMatch(v)
  document.querySelectorAll('.preset').forEach((p) => p.classList.toggle('on', +p.dataset.val === v))
  refreshSaveBar()
}
/* drag & drop: kanban e upload */
let dragId = null
document.addEventListener('dragstart', (e) => { const c = e.target.closest?.('.kcard'); if (!c) return; dragId = c.dataset.job; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging') })
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.kcol').forEach((c) => { c.style.background = ''; c.style.outlineColor = '' }) })
document.addEventListener('dragover', (e) => {
  const col = e.target.closest?.('.kcol'), drop = e.target.closest?.('#drop')
  if (col && dragId) { e.preventDefault(); document.querySelectorAll('.kcol').forEach((c) => { const on = c === col, s = STAGES.find((x) => x.id === c.dataset.stage); c.style.background = on ? s.color + '14' : ''; c.style.outlineColor = on ? s.color + '80' : '' }) }
  if (drop) { e.preventDefault(); drop.classList.add('over') }
})
document.addEventListener('dragleave', (e) => { const drop = e.target.closest?.('#drop'); if (drop && !drop.contains(e.relatedTarget)) drop.classList.remove('over') })
document.addEventListener('drop', (e) => {
  const col = e.target.closest?.('.kcol'), drop = e.target.closest?.('#drop')
  if (col && dragId) { e.preventDefault(); moveJob(dragId, col.dataset.stage); dragId = null; render() }
  else if (drop) { e.preventDefault(); drop.classList.remove('over'); uploadFiles(e.dataTransfer.files) }
})

render()
</script>
</body>
</html>
